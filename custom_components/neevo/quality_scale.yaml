# Integration Quality Scale self-assessment (custom integration — not
# officially scored; tracked against the core checklist). Target: Gold.
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No custom service actions.
  appropriate-polling:
    status: done
    comment: 6-hour coordinator interval; Otodata tank telemetry updates ~daily.
  brands:
    status: done
    comment: In-tree brand assets (custom_components/neevo/brand/, original
      artwork, generated by scripts/generate_brand.py); central brands PRs
      auto-close for custom integrations.
  common-modules:
    status: done
    comment: coordinator.py + entity.py (NeeVoEntity base).
  config-flow:
    status: done
  config-flow-test-coverage:
    status: done
    comment: User and reauth flows tested (success, invalid_auth,
      cannot_connect, no_tanks, already_configured).
  dependency-transparency:
    status: done
    comment: pyneevo, pinned, on PyPI, OSS.
  docs-actions:
    status: exempt
    comment: No custom service actions.
  docs-high-level-description:
    status: done
    comment: README "What it is" section.
  docs-installation-instructions:
    status: done
    comment: README HACS custom-repository steps.
  docs-removal-instructions:
    status: done
    comment: README Removal section.
  entity-event-setup:
    status: exempt
    comment: No event subscriptions.
  entity-unique-id:
    status: done
    comment: "{tank_id}_{description_key}."
  has-entity-name:
    status: done
  runtime-data:
    status: done
    comment: entry.runtime_data holds the NeeVoCoordinator.
  test-before-configure:
    status: done
    comment: Credentials validated by a live login + get_tanks_info in the flow.
  test-before-setup:
    status: done
    comment: async_config_entry_first_refresh; login failure raises
      ConfigEntryAuthFailed, transport failure raises ConfigEntryNotReady.
  unique-config-entry:
    status: done
    comment: unique_id = lowercased account email; _abort_if_unique_id_configured.

  # Silver
  action-exceptions:
    status: exempt
    comment: No custom service actions.
  config-entry-unloading:
    status: done
    comment: async_unload_entry unloads platforms and flushes the Store.
  docs-configuration-parameters:
    status: done
    comment: README states there is no options flow and documents fixed polling.
  docs-installation-parameters:
    status: done
    comment: README Configuration section (email + password).
  entity-unavailable:
    status: done
    comment: Coordinator-driven plus a per-tank availability override.
  integration-owner:
    status: done
  log-when-unavailable:
    status: done
    comment: DataUpdateCoordinator built-in once-per-transition logging.
  parallel-updates:
    status: done
    comment: PARALLEL_UPDATES = 0 in sensor.py.
  reauthentication-flow:
    status: done
  test-coverage:
    status: done
    comment: CI enforces --cov-fail-under=95.

  # Gold
  devices:
    status: done
    comment: One device per tank (DeviceInfo identifiers={(DOMAIN, tank.id)}).
  diagnostics:
    status: done
    comment: diagnostics.py - credentials/serial/id/address redacted; per-tank
      coordinator data and update health included.
  discovery:
    status: exempt
    comment: Cloud service; tanks are not locally discoverable.
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-data-update:
    status: done
    comment: README documents the 6-hour polling cadence and ~daily telemetry.
  docs-examples:
    status: done
    comment: README Energy-dashboard wiring and a low-level automation example.
  docs-known-limitations:
    status: done
    comment: README Known limitations (rate warms up over days, no historical
      backfill, one HA account per Nee-Vo login).
  docs-supported-devices:
    status: done
    comment: README "What it is" lists Otodata TM-series Nee-Vo monitors.
  docs-supported-functions:
    status: done
    comment: README entities table.
  docs-troubleshooting:
    status: done
    comment: README Troubleshooting section.
  docs-use-cases:
    status: done
    comment: README Energy-dashboard and consumption-rate use cases.
  dynamic-devices:
    status: exempt
    comment: Tanks are fixed per account; a new tank is picked up on the next
      coordinator refresh after a reload.
  entity-category:
    status: done
    comment: Pressure is diagnostic; all other sensors are primary measurements.
  entity-device-class:
    status: done
    comment: Applied where HA units permit (timestamp, gas, volume storage,
      pressure); the gal/day rate omits one (volume_flow_rate rejects gal/d).
  entity-disabled-by-default:
    status: done
    comment: Small per-tank entity set; nothing noisy enough to pre-disable.
  entity-translations:
    status: done
  exception-translations:
    status: done
    comment: Coordinator/flow raise translation-keyed errors (invalid_auth,
      cannot_connect, no_tanks); exceptions section in strings.json.
  icon-translations:
    status: done
  reconfiguration-flow:
    status: exempt
    comment: The only mutable field is the password, which reauth already
      handles; the account email is the entry's identity.
  repair-issues:
    status: exempt
    comment: No repairable scenarios beyond reauth (which HA surfaces itself).
  stale-devices:
    status: exempt
    comment: Tanks are fixed per account; removal is handled by deleting the
      config entry.

  # Platinum
  async-dependency:
    status: done
    comment: pyneevo is asyncio/aiohttp.
  inject-websession:
    status: todo
    comment: pyneevo manages its own session; upstream PR needed.
  strict-typing:
    status: done
    comment: mypy --strict clean (CI-enforced).
