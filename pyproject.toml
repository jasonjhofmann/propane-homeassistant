[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
# Must match the OLDEST supported interpreter (HA 2025.6 floor -> Python 3.13),
# not the newest: under py314, `ruff format` rewrites `except (A, B):` into the
# unparenthesized 3.14-only PEP 758 form — a SyntaxError on every HA running
# Python <= 3.13.
target-version = "py313"

[tool.mypy]
strict = true

# pyneevo ships no py.typed marker, so mypy --strict cannot follow its imports.
# Ignore only that dependency rather than weakening strictness on our own code.
[[tool.mypy.overrides]]
module = ["pyneevo.*"]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
