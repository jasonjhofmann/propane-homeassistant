name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.13 = the declared support floor (HA 2025.6 -> Python 3.13). The
        # floor leg catches 3.14-only syntax before it ships (see pyproject's
        # ruff target-version note).
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements_test.txt
      - run: pytest tests -q --cov=custom_components.neevo --cov-fail-under=95

  # Proves the floor declared in hacs.json is real. The other gates resolve
  # the LATEST Home Assistant, so code could start depending on a newer API
  # while HACS keeps offering the release to users on the declared floor.
  # Reads the floor from hacs.json and the integration's own requirements
  # from manifest.json, then imports every module against that exact release.
  #
  # This is also the only mypy run. HA 2026.9 moved core to probatio and
  # 2026.10 retyped schema arguments as probatio.Schema, so mypy against the
  # latest HA rejects the voluptuous schemas older releases need (probatio
  # does not exist before 2026.9). HA still accepts voluptuous schemas at
  # runtime, and the tests job covers runtime on the newest HA.
  minimum-supported-ha:
    name: Minimum supported HA (hacs.json floor)
    runs-on: ubuntu-latest
    env:
      # Must satisfy the floor's requires-python (HA 2025.6 = Python 3.13).
      FLOOR_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Everything resolves as of the floor's release date (+1 day), via
      # UV_EXCLUDE_NEWER. HA pins its direct dependencies but not all of
      # theirs, and a fresh resolve drifts past what the release shipped with:
      # HA 2025.6 pins aiodns 3.4.0 but not pycares, and pycares 5 removed an
      # API that aiodns uses, so the floor failed to import. (An integration
      # requirement newer than the floor would need --exclude-newer-package.)
      - name: Pin the floor and the integration's requirements
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.request
          floor = json.load(open("hacs.json"))["homeassistant"]
          reqs = json.load(open("custom_components/neevo/manifest.json"))["requirements"]
          with open("floor-requirements.txt", "w") as f:
              f.write("\n".join([f"homeassistant=={floor}", "voluptuous", *reqs]) + "\n")
          url = f"https://pypi.org/pypi/homeassistant/{floor}/json"
          files = json.load(urllib.request.urlopen(url))["urls"]
          released = min(
              dt.datetime.fromisoformat(u["upload_time_iso_8601"].replace("Z", "+00:00"))
              for u in files
          )
          cutoff = (released + dt.timedelta(days=1)).strftime("%Y-%m-%dT%H:%M:%SZ")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"UV_EXCLUDE_NEWER={cutoff}\n")
          print(f"Declared Home Assistant floor: {floor} (released {released:%Y-%m-%d}); "
                f"requirements: {reqs}; resolving as of {cutoff}")
          PY

      - name: Import every module against the floor
        run: |
          uv run --no-project --python "$FLOOR_PYTHON" \
            --with-requirements floor-requirements.txt \
            python -c "
          import importlib, pkgutil
          import custom_components.neevo as pkg
          names = [m.name for m in pkgutil.iter_modules(pkg.__path__)]
          for name in names:
              importlib.import_module(f'{pkg.__name__}.{name}')
          print(f'{len(names)} modules import on the declared floor')
          "

      - name: Mypy (strict) against the floor
        run: |
          uv run --no-project --python "$FLOOR_PYTHON" \
            --with-requirements floor-requirements.txt \
            --with mypy \
            mypy custom_components/neevo/
